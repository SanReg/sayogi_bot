<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Love Calculator</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #ffe6e6; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        h1 { color: #ff4d6d; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #ff4d6d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Love Calculator</h1>
        <input type="text" id="name1" placeholder="Your Name">
        <input type="text" id="name2" placeholder="Partner's Name">
        <button onclick="calculate()">Calculate</button>
        <div id="result"></div>
    </div>
    <script>
        function calculate() {
            const n1 = document.getElementById('name1').value;
            const n2 = document.getElementById('name2').value;
            if(n1 && n2) {
                const score = Math.floor(Math.random() * 101);
                document.getElementById('result').innerText = n1 + " and " + n2 + " are " + score + "% in love! ❤️";
            } else {
                alert("Please enter both names!");
            }
        }
    </script>
</body>
</html>
